server:
  port: 8080

spring:
  application:
    name: warden-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: demo-api
              uri: ${DEMO_API_URI:http://localhost:8082}
              predicates:
                - Path=/api/**

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:warden-api}
    audience: ${JWT_AUDIENCE:warden-gateway}

management:
  endpoints:
    web:
      exposure:
        include: health,info